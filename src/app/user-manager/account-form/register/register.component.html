<section>
  <h3 mat-dialog-title class="text-xl font-semibold text-cyan-800">Create Account</h3>
  <mat-dialog-content class="mat-typography register-container">
    <form #registerForm="ngForm" (ngSubmit)="onRegister(registerForm.value)" class="register-form">
      <div class="mb-2">
        <div
          class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
          [class.border-red-500]="!firstNameInput.pristine && firstNameInput.invalid"
        >
          <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-user"></i></span>
          <input
            type="text"
            [class.border-red-500]="!firstNameInput.pristine && firstNameInput.invalid"
            name="firstName"
            placeholder="First name"
            required
            [(ngModel)]="user.firstName"
            #firstNameInput="ngModel"
            class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
          />
        </div>
        <small [hidden]="firstNameInput.valid || firstNameInput.pristine" class="form-error">Please enter a first name.</small>
      </div>

      <div class="mb-2">
        <div
          class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
          [class.border-red-500]="!lastNameInput.pristine && lastNameInput.invalid"
        >
          <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-user"></i></span>
          <input
            type="text"
            [class.border-red-500]="!lastNameInput.pristine && lastNameInput.invalid"
            name="lastName"
            placeholder="Last name"
            required
            [(ngModel)]="user.lastName"
            #lastNameInput="ngModel"
            class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
          />
        </div>
        <small [hidden]="lastNameInput.valid || lastNameInput.pristine" class="form-error">Please enter a last name.</small>
      </div>

      <div class="mb-2">
        <div
          class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
          [class.border-red-500]="!usernameInput.pristine && usernameInput.invalid"
        >
          <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-id-card"></i></span>
          <input
            type="text"
            [class.border-red-500]="!usernameInput.pristine && usernameInput.invalid"
            name="username"
            placeholder="Username"
            required
            [(ngModel)]="user.username"
            #usernameInput="ngModel"
            class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
          />
        </div>
        <small [hidden]="usernameInput.valid || usernameInput.pristine" class="form-error">Please enter a username.</small>
      </div>

      <div class="mb-2">
        <div
          class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
          [class.border-red-500]="!emailInput.pristine && emailInput.invalid"
        >
          <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-envelope"></i></span>
          <input
            type="email"
            [class.border-red-500]="!emailInput.pristine && emailInput.invalid"
            name="email"
            placeholder="Email"
            required
            [(ngModel)]="user.email"
            #emailInput="ngModel"
            class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
          />
        </div>
        <small [hidden]="emailInput.valid || emailInput.pristine" class="form-error">Please enter an email.</small>
      </div>

      <div class="mb-2">
        <div
          class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
          [class.border-red-500]="!passwordInput.pristine && passwordInput.invalid"
        >
          <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-key"></i></span>
          <input
            type="password"
            [class.border-red-500]="!passwordInput.pristine && passwordInput.invalid"
            name="password"
            placeholder="Password"
            required
            [(ngModel)]="user.password"
            #passwordInput="ngModel"
            class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
          />
        </div>
        <small [hidden]="passwordInput.valid || passwordInput.pristine" class="form-error">Please enter a password.</small>
      </div>

      <div class="mt-3">
        <app-button
          title="register account"
          variant="primary"
          size="md"
          type="submit"
          [disabled]="registerForm.form.invalid || showLoading"
          customClass="w-full"
          (clicked)="onRegister(registerForm.value)"
        >
          @if (showLoading) {
            <i class="fa fa-spinner fa-spin"></i>
          }
          @if (showLoading) {
            <span>Loading...</span>
          }
          @if (!showLoading) {
            <span>Register</span>
          }
        </app-button>
      </div>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions class="flex items-center justify-between">
    Already have an account?
    <button type="button" matButton (click)="onClickLogin()" class="font-medium text-cyan-600 hover:text-cyan-800">Log In</button>
  </mat-dialog-actions>
</section>
