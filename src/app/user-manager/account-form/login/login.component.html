<div>
  <h3 mat-dialog-title>Login</h3>
  <mat-dialog-content class="login-container">
    <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="login-form">
      <div>
        <div class="mb-4">
          <div class="flex items-center border border-cyan-300 rounded-lg overflow-hidden bg-white">
            <span class="input-group-text bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-user"></i></span>
            <input type="text" [class.text-box-error]="!usernameInput.pristine && usernameInput.invalid" name="username"
              placeholder="Username" ngModel #usernameInput="ngModel" required
              class="flex-1 px-3 py-2 focus:outline-none login-input" />
          </div>
          @if (usernameInput.invalid && usernameInput.touched) {
          <span class="text-red-600 text-sm mt-1 form-error">Please enter a username.</span>
          }
        </div>
        <div class="mb-4">
          <div class="flex items-center border border-cyan-300 rounded-lg overflow-hidden bg-white">
            <span class="input-group-text bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-key"></i></span>
            <input type="password" [class.text-box-error]="!passwordInput.pristine && passwordInput.invalid"
              name="password" placeholder="Password" ngModel #passwordInput="ngModel" required
              class="flex-1 px-3 py-2 focus:outline-none login-input" />
          </div>
          @if (passwordInput.invalid && passwordInput.touched) {
          <span class="text-red-600 text-sm mt-1 form-error">Please enter a password.</span>
          }
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || showLoading" name="button" class="login-btn">
        @if (showLoading) {
        <i class="fa fa-spinner fa-spin"></i>
        }
        &nbsp;&nbsp;
        @if (showLoading) {
        <span>Loading...</span>
        }
        @if (!showLoading) {
        <span>Login</span>
        }
      </button>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions class="flex items-center justify-between">
    Don't have an account yet?
    <button matButton (click)="onClickRegister()" class="links">Register</button>
  </mat-dialog-actions>
</div>
