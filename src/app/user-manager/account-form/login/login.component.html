<div>
  <h3 mat-dialog-title>Login</h3>
  <mat-dialog-content class="login-container">
    <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="login-form">
      <div class="space-y-4">
        <div>
          <div
            class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
            [class.border-red-500]="!usernameInput.pristine && usernameInput.invalid"
          >
            <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-user"></i></span>
            <input
              type="text"
              [class.border-red-500]="!usernameInput.pristine && usernameInput.invalid"
              name="username"
              placeholder="Username"
              ngModel
              #usernameInput="ngModel"
              required
              class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
            />
          </div>
          @if (usernameInput.invalid && usernameInput.touched) {
            <span class="form-error">Please enter a username.</span>
          }
        </div>

        <div>
          <div
            class="flex items-center overflow-hidden rounded-lg border border-cyan-300 bg-white"
            [class.border-red-500]="!passwordInput.pristine && passwordInput.invalid"
          >
            <span class="bg-cyan-100 px-3 py-2 text-cyan-700"><i class="fa fa-key"></i></span>
            <input
              type="password"
              [class.border-red-500]="!passwordInput.pristine && passwordInput.invalid"
              name="password"
              placeholder="Password"
              ngModel
              #passwordInput="ngModel"
              required
              class="w-full flex-1 bg-transparent px-3 py-2 focus:outline-none"
            />
          </div>
          @if (passwordInput.invalid && passwordInput.touched) {
            <span class="form-error">Please enter a password.</span>
          }
        </div>
      </div>

      <app-button
        title="login button"
        variant="primary"
        size="md"
        type="submit"
        [disabled]="loginForm.invalid || showLoading"
        customClass="w-full"
        (clicked)="onLogin(loginForm)"
      >
        @if (showLoading) {
          <i class="fa fa-spinner fa-spin"></i>
        }
        @if (showLoading) {
          <span>Loading...</span>
        }
        @if (!showLoading) {
          <span>Login</span>
        }
      </app-button>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions class="flex items-center justify-between">
    Don't have an account yet?
    <button matButton (click)="onClickRegister()" class="text-cyan-700 transition hover:text-emerald-700">Register</button>
  </mat-dialog-actions>
</div>
