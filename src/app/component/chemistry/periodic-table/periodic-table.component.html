<div class="periodic-table-container">
  <div class="table-header">
    <h2>Periodic Table</h2>

    <!-- Filter buttons for group blocks -->
    <div class="filter-buttons">
      <button
        (click)="filterElements('all')"
        [class.active]="currentFilter() === 'all'"
        class="filter-btn"
      >
        All Elements
      </button>
      @for (group of groupBlocks; track group) {
        <button
          (click)="filterElements(group)"
          [class.active]="currentFilter() === group"
          class="filter-btn"
        >
          {{ group }}
        </button>
      }
    </div>
  </div>

  <!-- Loading spinner -->
  @if (progressSpinner) {
    <div class="spinner-container">
      <mat-spinner></mat-spinner>
    </div>
  }

  <!-- Periodic table grid -->
  <div class="periodic-table-grid"
       [ngClass]="{ 'loading': progressSpinner }"
       role="grid"
       aria-label="Periodic table of elements">

    <!-- Grid items for elements -->
    @for (element of filteredElements(); track element.atomicNumber) {
      <div
        class="element-card {{ getElementClass(element.groupBlock) }}"
        [class.in-experiment]="isElementInExperiment(element.symbol)"
        (click)="selectElement(element)"
        role="gridcell"
        tabindex="0"
        [attr.aria-label]="'Element ' + element.name + ' with atomic number ' + element.atomicNumber"
      >
        <div class="element-content">
          <span class="atomic-number">{{ element.atomicNumber }}</span>
          <span class="symbol">{{ element.symbol }}</span>
          <span class="name">{{ element.name }}</span>
          <span class="atomic-mass">{{ element.atomicMass }}</span>
        </div>
      </div>
    }
  </div>
</div>
