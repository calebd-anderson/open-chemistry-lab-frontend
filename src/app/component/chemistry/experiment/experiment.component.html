<article class="relative">
  @if (experimentService.getIsActive()) {
    <mat-progress-bar mode="indeterminate" />
  }
  <div id="experiment-box">
    <section
      id="compound-test"
      [class.active]="elementsInCompound().length > 0"
    >
      @if (elementsInCompound().length > 0) {
        <div class="compound">
          @for (
            item of elementsInCompound();
            track item.id;
            let i = $index
          ) {
            <div
              class="element-in-compound"
              (click)="removeElementFromCompound(i, item.element)"
              [attr.data-element]="item.element.symbol"
              [attr.data-index]="i"
              [style.border-color]="item.element.cPKHexColor ? '#' + item.element.cPKHexColor : undefined"
              [style.box-shadow]="item.element.cPKHexColor ? '0 0 10px #' + item.element.cPKHexColor : undefined"
            >
              <span class::element-symbol [style.color]="item.element.cPKHexColor ? '#' + item.element.cPKHexColor : undefined">{{ item.element.symbol }}</span>
              <span class="element-name">{{ item.element.name }}</span>
            </div>
          }
        </div>
        <!-- run experiment buttons -->
        <div id="validate-btn">
          <button
            matButton="elevated"
            color="primary"
            (click)="runExperiment.emit()"
            class="experiment-button"
            id="run-btn"
          >
            <span>Run Experiment</span>
          </button>
          <button
            matButton="elevated"
            color="warn"
            (click)="clearExperiment.emit()"
            class="experiment-button"
            id="clear-btn"
          >
            <span>Clear Experiment</span>
          </button>
        </div>
      } @else {
        <div class="empty-state">
          <svg info-icon></svg>
          <p>
            The experiment is empty. Add elements to begin your chemistry
            exploration!
          </p>
        </div>
      }
    </section>
    <section id="flask-container">
      <app-flask id="flask" />
    </section>
  </div>
</article>
