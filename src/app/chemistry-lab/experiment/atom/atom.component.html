<div
  class="element-in-compound"
  (click)="removeElementFromCompound(index(), atom().element)"
  (keydown.enter)="removeElementFromCompound(index(), atom().element)"
  (keydown.space)="removeElementFromCompound(index(), atom().element); $event.preventDefault()"
  [attr.data-element]="atom().element.symbol"
  [attr.data-index]="index()"
  [attr.aria-label]="'Remove ' + atom().element.name + ' from experiment'"
  title="Remove element"
  role="button"
  tabindex="0"
  animate.enter="element-enter-animation"
>
  <svg class="atom-orbits" aria-hidden="true" viewBox="0 0 100 100" fill="none">
    <ellipse class="atom-orbit atom-orbit--one" cx="50" cy="50" rx="40" ry="15" />
    <ellipse class="atom-orbit atom-orbit--two" cx="50" cy="50" rx="40" ry="15" transform="rotate(60 50 50)" />
    <ellipse class="atom-orbit atom-orbit--three" cx="50" cy="50" rx="40" ry="15" transform="rotate(120 50 50)" />
    <circle class="atom-electron" cx="89" cy="50" r="2.4" />
    <circle class="atom-electron" cx="30.5" cy="16.2" r="2.4" />
    <circle class="atom-electron" cx="30.5" cy="83.8" r="2.4" />
    <circle class="atom-nucleus" cx="50" cy="50" r="4" />
  </svg>
  <span class="element-symbol">{{ atom().element.symbol }}</span>
  <span class="element-name">{{ atom().element.name }}</span>
</div>
