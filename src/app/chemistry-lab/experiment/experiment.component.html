<section>
  <!-- @if (experimentService.getIsActive()) {
  <mat-progress-bar mode="indeterminate" />
  } -->
  <div id="experiment-box">
    <div id="compound-test">
      @if (elementsInCompound().length) {
      <div class="experiment-state">
        <div class="compound">
          @for (
            item of elementsInCompound();
            track item.id;
            let i = $index
          ) {
            <app-atom [atom]="item" [index]="i" (removeAtomEvent)="removeAtomFromExperiment($event)"
              animate.leave="element-leave-animation" />
          }
        </div>
        <!-- run experiment buttons -->
        <div id="validate-btn" animate.leave="button-leave-animation">
          <app-button title="Run experiment" variant="primary" size="md" customClass="lab-action lab-action--run"
            (clicked)="runExperiment.emit()">Run
            Experiment</app-button>
          <app-button title="Analyze with machine learning" variant="primary" size="md"
            customClass="lab-action lab-action--analyze"
            (clicked)="analyzeFormula.emit()">Analyze With ML</app-button>
          <app-button title="Reset experiment" variant="secondary" size="md" customClass="lab-action lab-action--reset"
            (clicked)="clearExperiment.emit()">Reset
            Experiment</app-button>
        </div>
      </div>
      } @else {
      <div
        class="empty-state"
        animate.enter="info-enter-animation"
        animate.leave="info-leave-animation"
      >
        <svg info-icon></svg>
        <p>
          The experiment is empty. Add elements to begin your chemistry
          exploration!
        </p>
      </div>
      }
    </div>
    <div id="flask-container">
      <app-flask id="flask" />
    </div>
  </div>
</section>
