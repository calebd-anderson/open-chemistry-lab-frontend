<section>
  <!-- @if (experimentService.getIsActive()) {
  <mat-progress-bar mode="indeterminate" />
  } -->
  <div id="experiment-box">
    <div id="compound-test">
      @if (elementsInCompound().length) {
      <div class="compound" animate.leave="compound-leave-animation">
        @for (
        item of elementsInCompound();
        track item.id;
        let i = $index
        ) {
        <app-atom [atom]="item" [index]="i" (removeAtomEvent)="removeAtomFromExperiment($event)"
          animate.leave="element-leave-animation" />
        }
      </div>
      <!-- run experiment buttons -->
      <div id="validate-btn">
        <app-button title="run experiment button" variant="primary" size="md" (clicked)="runExperiment.emit()">Run
          Experiment</app-button>
        <app-button title="run experiment button" variant="secondary" size="md" (clicked)="clearExperiment.emit()">Reset
          Experiment</app-button>
        <app-button title="run experiment button" variant="secondary" size="md"
          (clicked)="analyzeFormula.emit()">Analyze With ML</app-button>
      </div>
      } @else {
      <div class="empty-state" animate.enter="info-enter-animation">
        <svg info-icon></svg>
        <p>
          The experiment is empty. Add elements to begin your chemistry
          exploration!
        </p>
      </div>
      }
    </div>
    <div id="flask-container">
      <app-flask id="flask" />
    </div>
  </div>
</section>
