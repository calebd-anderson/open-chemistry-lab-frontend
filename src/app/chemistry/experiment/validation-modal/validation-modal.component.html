<section class="validation-modal">
  <h2>Molecule Discovery!</h2>
  <div class="dialog-content">
    <p>You've created a <span id="discovery">{{discovery}}</span> molecule.</p>
    <p>{{confirmMessage}}</p>
  </div>
  <div class="dialog-actions">
    <app-button title="dismiss validation modal" variant="ghost" size="md" type="button" (clicked)="onNoClick()">Cancel</app-button>
  </div>
</section>
