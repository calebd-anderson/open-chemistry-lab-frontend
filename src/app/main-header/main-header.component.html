<header id="main-header">
  <div class="brand">
    <svg logo-icon id="logo-icon" class="brand__mark" aria-hidden="true"></svg>
    <div class="brand__wordmark">
      <span class="brand__name">Catalyst Engine</span>
      <span class="brand__edition">The Alchemist’s Codex</span>
    </div>
  </div>

  <app-tabs />

  @if (authenticationService.isLoggedIn()) {
    <app-user-nav [(user)]="user" />
  }

  <div id="user-controls">
    <div [hidden]="authenticationService.isLoggedIn()">
      <app-button
        title="login button"
        variant="secondary"
        size="md"
        customClass="codex-header-login"
        (clicked)="openLogin()"
      >
        Login
      </app-button>
    </div>

    <div class="profile-icon" [hidden]="!authenticationService.isLoggedIn()">
      <button
        (click)="openMenu()"
        type="button"
        aria-label="Open profile menu"
        class="profile-icon__button"
      >
        <img
          height="32"
          width="32"
          [src]="profileImage()"
          class="profile-icon__image"
          alt="Profile image"
        />
      </button>
    </div>
  </div>
</header>
